name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
      has_apps: ${{ steps.detect.outputs.has_apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/changed-apps.mjs

  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:boundaries && pnpm test:boundaries
      - run: pnpm exec biome check package.json biome.json scripts packages
      - run: pnpm --filter @repo/shared test

  app-build:
    needs: changes
    if: needs.changes.outputs.has_apps == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "./apps/${{ matrix.app }}..."
      - run: pnpm --dir "apps/${{ matrix.app }}" lint
      - run: pnpm --dir "apps/${{ matrix.app }}" build
      - name: Build independently deployable web image
        run: docker build -f "apps/${{ matrix.app }}/Dockerfile" --target web -t "${{ matrix.app }}:ci" .
      - name: Build sandbox image (not for production)
        run: docker build -f "apps/${{ matrix.app }}/Dockerfile" --target sandbox -t "${{ matrix.app }}-sandbox:ci" .

  app-e2e:
    needs: changes
    if: needs.changes.outputs.has_apps == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "./apps/${{ matrix.app }}..."
      - run: pnpm --dir "apps/${{ matrix.app }}" exec playwright install chromium --with-deps
      - run: pnpm --dir "apps/${{ matrix.app }}" test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-${{ matrix.app }}
          path: |
            apps/${{ matrix.app }}/playwright-report/
            apps/${{ matrix.app }}/test-results/
          retention-days: 14

  # Stable, always-reporting branch protection gates, including docs-only PRs.
  build:
    if: always()
    needs: [changes, repo, app-build]
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          REPO: ${{ needs.repo.result }}
          APP: ${{ needs.app-build.result }}
          HAS_APPS: ${{ needs.changes.outputs.has_apps }}
        run: |
          test "$CHANGES" = success
          test "$REPO" = success
          if [ "$HAS_APPS" = true ]; then
            test "$APP" = success
          else
            test "$HAS_APPS" = false
            test "$APP" = skipped
          fi

  e2e:
    if: always()
    needs: [changes, app-e2e]
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          APP: ${{ needs.app-e2e.result }}
          HAS_APPS: ${{ needs.changes.outputs.has_apps }}
        run: |
          test "$CHANGES" = success
          if [ "$HAS_APPS" = true ]; then
            test "$APP" = success
          else
            test "$HAS_APPS" = false
            test "$APP" = skipped
          fi
